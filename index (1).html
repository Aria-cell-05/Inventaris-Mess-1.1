.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.bar{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
input,select{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 10px;border-radius:10px;font:inherit;min-width:0}
input:focus,select:focus{outline:2px solid var(--ac2);outline-offset:0}
.bar input{flex:1;min-width:150px}
button{font:inherit;cursor:pointer}
.btn{background:var(--ac);color:#fff;border:0;padding:9px 14px;border-radius:10px;font-weight:600}
.btn.g{background:var(--card);color:var(--ac);border:1px solid var(--bd)}
.stats{display:flex;gap:8px;margin-bottom:10px;font-size:13px;color:var(--mu);flex-wrap:wrap}
.stats span{background:var(--soft);padding:3px 10px;border-radius:20px}.stats b{color:var(--ac)}
.it{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--ac2);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center;box-shadow:0 1px 3px #0f3d1f12}
.it.zero{border-left-color:var(--dg)}
.inf{flex:1;min-width:0}.nm{font-weight:600}.mt{font-size:12.5px;color:var(--mu)}
.q{display:flex;align-items:center;gap:6px}
.q button{width:32px;height:32px;border-radius:50%;border:0;background:var(--soft);color:var(--ac);font-size:18px;font-weight:700}
.qn{min-width:46px;text-align:center;font-weight:700;color:var(--ac)}.zero .qn{color:var(--dg)}
.tag{font-size:11px;padding:1px 8px;border-radius:10px;background:var(--dg);color:#fff;margin-left:6px}
.ac{display:flex;flex-direction:column;gap:4px}.ac button{background:none;border:0;color:var(--mu);font-size:12px;padding:2px}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);width:min(420px,92vw);padding:16px}
dialog::backdrop{background:#0008}dialog b{color:var(--ac)}
label{display:block;font-size:12.5px;color:var(--mu);margin:8px 0 3px}dialog input,dialog select{width:100%}
.r{display:flex;gap:8px}.r>div{flex:1}
.empty{text-align:center;color:var(--mu);padding:30px}
.note{font-size:12px;color:var(--mu);margin-top:12px;text-align:center}

<dialog id="dlg"><form method="dialog" id="f">
<b id="dt">Tambah barang</b>
<label>Nama barang</label><input id="fn" required placeholder="Elbow PVC">
<label>Kategori</label><select id="fk"></select>
<label>Spesifikasi / ukuran</label><input id="fs" placeholder='3/4" , 90°'>
<div class="r"><div><label>Jumlah</label><input id="fq" type="number" min="0" step="any" value="0"></div>
<div><label>Satuan</label><input id="fu" placeholder="pcs / batang / liter"></div>
</div>
<label>Lokasi simpan</label><input id="fl" placeholder="Rak 2 / Gudang belakang">
<div class="r" style="margin-top:14px"><button class="btn g" type="button" id="cn">Batal</button><button class="btn" id="sv">Simpan</button></div>
</form></dialog>
<script>
// URL Web App Google Apps Script
const API_URL="https://script.google.com/macros/s/AKfycbysn2OsgTP10Nf1cv6DKA88EDt26D8IJTGv-V2luZ6kjbETBLyQA7nKjTf7-PNrJYUg/exec";
const CATS=["Material Bangunan","Alat Bangunan","Alat Laboratorium","Bahan Laboratorium"];
let items=[],cat="Semua",editId=null,pw="";
try{pw=localStorage.getItem("pw")||""}catch(e){}
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const note=t=>$("note").textContent=t;
$("fk").innerHTML=CATS.map(c=>`<option>${c}</option>`).join("");
async function call(body){
  const r=body?await fetch(API_URL,{method:"POST",body:JSON.stringify({...body,pw})}):await fetch(API_URL+"?pw="+encodeURIComponent(pw));
  const d=await r.json();
  if(d.error==="auth"){pw=prompt("Masukkan kata sandi:")||"";try{localStorage.setItem("pw",pw)}catch(e){}
    if(pw)return call(body);throw new Error("auth")}
  return d;
}
async function refresh(){
  if(API_URL.startsWith("PASTE")){note("API_URL belum diisi.");return}
  try{const d=await call();items=d.items;render();note("Tersinkron "+new Date().toLocaleTimeString("id-ID"))}
  catch(e){note("Gagal terhubung ke Google Sheets.")}
}
async function send(body){
  try{const d=await call(body);items=d.items;render();note("Tersimpan "+new Date().toLocaleTimeString("id-ID"))}
  catch(e){note("Gagal menyimpan, memuat ulang…");refresh()}
}
function put(it){const i=items.findIndex(x=>x.id===it.id);i>=0?items[i]=it:items.push(it);render();note("Menyimpan…");send({action:"save",id:it.id,item:it})}
function adj(it,d){it.qty=Math.max(0,+(it.qty+d).toFixed(3));render();note("Menyimpan…");send({action:"adjust",id:it.id,delta:d})}
function del(id){items=items.filter(x=>x.id!==id);render();note("Menyimpan…");send({action:"delete",id})}
function render(){
  $("tabs").innerHTML=["Semua",...CATS].map(c=>`<button class="tab ${c===cat?"on":""}" data-c="${c}">${c}</button>`).join("");
  const s=$("q").value.trim().toLowerCase();
  const v=items.filter(i=>(cat==="Semua"||i.kategori===cat)&&(!s||[i.nama,i.spek,i.lokasi].join(" ").toLowerCase().includes(s))).sort((a,b)=>String(a.nama).localeCompare(String(b.nama)));
  const zero=v.filter(i=>i.qty<=0).length;
  $("stats").innerHTML=`<span><b>${v.length}</b> jenis barang</span><span><b>${zero}</b> habis</span>`;
  const e=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  $("list").innerHTML=v.length?v.map(i=>{
    const z=i.qty<=0;
    return `<div class="it ${z?"zero":""}"><div class="inf"><div class="nm">${e(i.nama)}${z?'<span class="tag">Habis</span>':""}</div>
    <div class="mt">${e(i.spek)}${i.spek&&i.lokasi?" · ":""}${i.lokasi?"📍 "+e(i.lokasi):""}${cat==="Semua"?" · "+e(i.kategori):""}</div></div>
    <div class="q"><button data-a="m" data-id="${e(i.id)}">−</button><div class="qn">${i.qty}<div class="mt">${e(i.satuan)}</div></div><button data-a="p" data-id="${e(i.id)}">+</button></div>
    <div class="ac"><button data-a="e" data-id="${e(i.id)}">Edit</button><button data-a="d" data-id="${e(i.id)}">Hapus</button></div></div>`}).join("")
    :`<div class="empty">Belum ada barang. Klik <b>+ Barang</b> untuk mulai.</div>`;
}
$("tabs").onclick=e=>{const c=e.target.dataset.c;if(c){cat=c;render()}};
$("q").oninput=render;
$("list").onclick=e=>{
  const a=e.target.dataset.a,id=e.target.dataset.id;if(!a)return;
  const it=items.find(x=>String(x.id)===id);if(!it)return;
  if(a==="p")adj(it,1);if(a==="m"&&it.qty>0)adj(it,-1);
  if(a==="d"&&confirm(`Hapus "${it.nama}"?`))del(it.id);
  if(a==="e")openForm(it);
};
function openForm(it){
  editId=it?it.id:null;$("dt").textContent=it?"Edit barang":"Tambah barang";
  $("fn").value=it?.nama||"";$("fk").value=it?.kategori||(cat!=="Semua"?cat:CATS[0]);
  $("fs").value=it?.spek||"";$("fq").value=it?.qty??0;$("fu").value=it?.satuan||"";$("fl").value=it?.lokasi||"";
  $("dlg").showModal();
}
$("add").onclick=()=>openForm(null);$("cn").onclick=()=>$("dlg").close();
$("f").onsubmit=()=>put({id:editId||uid(),nama:$("fn").value.trim(),kategori:$("fk").value,spek:$("fs").value.trim(),qty:+$("fq").value||0,satuan:$("fu").value.trim(),lokasi:$("fl").value.trim()});
$("csv").onclick=()=>{
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const rows=[["Nama","Kategori","Spesifikasi","Jumlah","Satuan","Lokasi"],...items.map(i=>[i.nama,i.kategori,i.spek,i.qty,i.satuan,i.lokasi])].map(r=>r.map(q).join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+rows],{type:"text/csv"}));a.download="inventaris-mess.csv";a.click();
};
render();refresh();
setInterval(()=>{if(!$("dlg").open)refresh()},20000);
</script></body></html>
